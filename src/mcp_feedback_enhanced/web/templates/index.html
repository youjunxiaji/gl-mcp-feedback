<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script>
        (function() {
            var mode = localStorage.getItem('feedbackThemeMode') || 'auto';
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var resolved = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
            document.documentElement.classList.toggle('dark', resolved === 'dark');
            document.documentElement.classList.toggle('light', resolved === 'light');
            document.documentElement.dataset.themeMode = mode;
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon.svg">

    <script src="/static/js/vendor/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'SF Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        surface: {
                            base: 'rgb(var(--surface-base) / <alpha-value>)',
                            raised: 'rgb(var(--surface-raised) / <alpha-value>)',
                            overlay: 'rgb(var(--surface-overlay) / <alpha-value>)',
                            muted: 'rgb(var(--surface-muted) / <alpha-value>)',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/static/fonts/dm-sans-normal.woff2) format('woff2');
        }
        @font-face {
            font-family: 'DM Sans';
            font-style: italic;
            font-weight: 400;
            font-display: swap;
            src: url(/static/fonts/dm-sans-italic.woff2) format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 600;
            font-display: swap;
            src: url(/static/fonts/jetbrains-mono-normal.woff2) format('woff2');
        }
    </style>
    <style>
        :root {
            --surface-base: 11 14 20;
            --surface-raised: 17 22 32;
            --surface-overlay: 23 29 43;
            --surface-muted: 30 38 54;
        }
        html.light {
            color-scheme: light;
            --surface-base: 246 248 251;
            --surface-raised: 255 255 255;
            --surface-overlay: 241 245 249;
            --surface-muted: 226 232 240;
        }
        html.light body { background: #f6f8fb; color: #172033; }
        html.light [class*="text-slate-100"],
        html.light [class*="text-slate-200"],
        html.light [class*="text-slate-300"] { color: #172033 !important; }
        html.light [class*="text-slate-400"],
        html.light [class*="text-slate-500"],
        html.light [class*="text-slate-600"] { color: #64748b !important; }
        @keyframes breathe {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.1; transform: scale(1.5); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="bg-surface-base text-slate-200 font-sans h-screen flex flex-col items-center justify-center overflow-hidden antialiased">

    <div class="flex flex-col items-center gap-6 text-center px-6">
        <!-- Logo -->
        <div class="w-16 h-16 rounded-[18px] bg-gradient-to-br from-blue-500 to-violet-500 flex items-center justify-center text-[28px] text-white font-extrabold shadow-[0_8px_30px_rgba(59,130,246,0.3)] animate-[float_3s_ease-in-out_infinite]">
            M
        </div>

        <!-- Title -->
        <div>
            <h1 class="text-2xl font-bold text-slate-100 mb-1.5">MCP Feedback Enhanced</h1>
            <p class="text-[15px] text-slate-400">Web UI 交互式反馈收集工具</p>
            <span class="inline-block mt-2 font-mono text-xs text-blue-400 bg-blue-500/[0.12] px-2.5 py-0.5 rounded-full">v{{ version }}</span>
        </div>

        <!-- Status -->
        <div class="flex items-center gap-2.5 mt-4">
            <div class="relative w-[9px] h-[9px]">
                <div class="absolute inset-0 rounded-full bg-amber-400"></div>
                <div class="absolute -inset-[4px] rounded-full bg-amber-400 animate-[pulse-ring_2s_ease-in-out_infinite]"></div>
            </div>
            <span id="statusText" class="text-[14px] font-medium text-amber-400">等待 MCP 服务调用...</span>
        </div>

        <p class="text-xs text-slate-500 max-w-sm leading-relaxed mt-2">
            当 AI 代理调用 <code class="font-mono text-xs text-blue-400 bg-surface-overlay px-1.5 py-0.5 rounded">interactive_feedback</code> 工具时，页面将自动跳转到反馈界面。
        </p>
    </div>

    <script>
        function checkSession() {
            fetch('/api/status')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.has_session) {
                        location.reload();
                    }
                })
                .catch(function() {});
        }

        setInterval(checkSession, 3000);
    </script>
</body>
</html>
