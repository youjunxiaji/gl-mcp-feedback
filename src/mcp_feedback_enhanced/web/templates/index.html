<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gl-mcp-feedback</title>

    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon.svg">

    <script src="/static/js/vendor/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'SF Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        surface: {
                            base: '#0b0e14',
                            raised: '#111620',
                            overlay: '#171d2b',
                            muted: '#1e2636',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url(/static/fonts/dm-sans-normal.woff2) format('woff2');
        }
        @font-face {
            font-family: 'DM Sans';
            font-style: italic;
            font-weight: 400;
            font-display: swap;
            src: url(/static/fonts/dm-sans-italic.woff2) format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 600;
            font-display: swap;
            src: url(/static/fonts/jetbrains-mono-normal.woff2) format('woff2');
        }
    </style>
    <style>
        @keyframes breathe {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.1; transform: scale(1.5); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="bg-surface-base text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center antialiased">

    <main class="flex flex-col items-center gap-6 text-center px-6 py-10 w-full max-w-xl">
        <!-- Logo -->
        <div class="w-16 h-16 rounded-[18px] bg-gradient-to-br from-blue-500 to-violet-500 flex items-center justify-center text-[28px] text-white font-extrabold shadow-[0_8px_30px_rgba(59,130,246,0.3)] animate-[float_3s_ease-in-out_infinite]">
            M
        </div>

        <!-- Title -->
        <div>
            <h1 class="text-2xl font-bold text-slate-100 mb-1.5">gl-mcp-feedback</h1>
            <p class="text-[15px] text-slate-400">Web UI 交互式反馈收集工具</p>
            <span class="inline-block mt-2 font-mono text-xs text-blue-400 bg-blue-500/[0.12] px-2.5 py-0.5 rounded-full">v{{ version }}</span>
        </div>

        <!-- 对话列表：每个对话一个入口 -->
        <ul id="roomList" class="hidden w-full flex flex-col gap-2.5 text-left" aria-label="对话列表"></ul>

        <!-- 没有对话时的等待提示 -->
        <div id="emptyState" class="flex flex-col items-center">
            <div class="flex items-center gap-2.5 mt-4">
                <div class="relative w-[9px] h-[9px]">
                    <div class="absolute inset-0 rounded-full bg-amber-400"></div>
                    <div class="absolute -inset-[4px] rounded-full bg-amber-400 animate-[pulse-ring_2s_ease-in-out_infinite]"></div>
                </div>
                <span id="statusText" class="text-[14px] font-medium text-amber-400">等待 MCP 服务调用...</span>
            </div>

            <p class="text-xs text-slate-500 max-w-sm leading-relaxed mt-4">
                当 AI 代理调用 <code class="font-mono text-xs text-blue-400 bg-surface-overlay px-1.5 py-0.5 rounded">interactive_feedback</code> 工具时，对应的对话会出现在这里，每个对话有自己的反馈页面。
            </p>
        </div>
    </main>

    <script>
        const POLL_INTERVAL_MS = 3000;

        const formatTime = (timestamp) => {
            const date = new Date(timestamp);
            const pad = (value) => String(value).padStart(2, '0');
            return pad(date.getHours()) + ':' + pad(date.getMinutes());
        };

        const createChip = (text, className) => {
            const chip = document.createElement('span');
            chip.className = className;
            chip.textContent = text;
            return chip;
        };

        // 项目目录来自 AI 的调用参数，一律按纯文本显示
        const createRoomItem = (room) => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = '/c/' + encodeURIComponent(room.room_id) + '/';
            link.className = 'block bg-surface-raised border border-white/[0.06] rounded-xl px-4 py-3 hover:border-blue-500/40 hover:bg-surface-overlay transition';

            const top = document.createElement('div');
            top.className = 'flex items-center justify-between gap-3';
            const title = createChip(room.title, 'text-[15px] font-semibold text-slate-100 truncate');
            const state = room.awaiting_feedback
                ? createChip('等你回复', 'shrink-0 text-xs font-medium text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-full')
                : createChip('AI 处理中', 'shrink-0 text-xs font-medium text-slate-400 bg-surface-overlay px-2 py-0.5 rounded-full');
            top.append(title, state);

            const meta = document.createElement('div');
            meta.className = 'mt-1.5 flex items-center gap-3 text-xs text-slate-500';
            const directory = createChip(room.project_directory, 'min-w-0 flex-1 font-mono truncate');
            directory.title = room.project_directory;
            meta.append(directory);
            if (room.pending_count > 0) {
                meta.append(createChip('排队 ' + room.pending_count + ' 条', 'shrink-0 text-amber-400'));
            }
            meta.append(createChip('最近 ' + formatTime(room.last_activity), 'shrink-0'));

            link.append(top, meta);
            item.append(link);
            return item;
        };

        const renderRooms = (rooms) => {
            const list = document.getElementById('roomList');
            const empty = document.getElementById('emptyState');
            list.replaceChildren(...rooms.map(createRoomItem));
            list.classList.toggle('hidden', rooms.length === 0);
            empty.classList.toggle('hidden', rooms.length !== 0);
        };

        const refreshRooms = async () => {
            try {
                const response = await fetch('/api/rooms');
                if (!response.ok) return;
                const data = await response.json();
                renderRooms(data.rooms || []);
            } catch (err) {
                console.warn('refreshRooms failed', err);
            }
        };

        refreshRooms();
        setInterval(refreshRooms, POLL_INTERVAL_MS);
    </script>
</body>
</html>
